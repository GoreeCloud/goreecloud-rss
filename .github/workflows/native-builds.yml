name: Native Build Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/native-builds.yml'

permissions:
  contents: read

jobs:
  linux-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install JavaScript dependencies
        run: npm install
      - name: Build desktop bundle
        run: npm run desktop:build

  android-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Rust with Android targets
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Configure Android NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/$(ls -1 \"$ANDROID_HOME/ndk\" | tail -n 1)" >> "$GITHUB_ENV"
      - name: Install JavaScript dependencies
        run: npm install
      - name: Initialize Android project
        run: npm run android:init -- --ci
      - name: Build unsigned development APK
        run: npm run android:build
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-feed-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
