name: Native Build Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/feed-mark.svg'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/native-builds.yml'

permissions:
  contents: read

jobs:
  linux-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install JavaScript dependencies
        run: npm install
      - name: Generate application icons
        run: npm run icons
      - name: Build desktop Debian package
        run: npm run desktop:build
      - name: Upload Linux Debian package
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-feed-linux-amd64-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  android-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Rust with Android targets
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Configure Android NDK
        run: |
          NDK_VERSION="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          test -n "$NDK_VERSION"
          test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install JavaScript dependencies
        run: npm install
      - name: Generate desktop icon prerequisites
        run: npm run icons
      - name: Initialize Android project
        run: npm run android:init -- --ci
      - name: Generate Android application icons
        run: npm run icons
      - name: Build unsigned development APK
        run: npm run android:build
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-feed-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
