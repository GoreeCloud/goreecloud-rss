name: Native Build Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'docs/RELEASE.md'
      - 'public/feed-mark.svg'
      - 'package.json'
      - 'package-lock.json'
      - 'rust-toolchain.toml'
      - 'vite.config.ts'
      - '.github/workflows/native-builds.yml'

concurrency:
  group: native-builds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install pinned Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install 1.97.1 --profile minimal
          "$HOME/.cargo/bin/rustc" +1.97.1 --version
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Validate release metadata
        run: npm run release:check
      - name: Validate Rust lock consistency
        run: cargo +1.97.1 metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 >/dev/null
      - name: Generate application icons
        run: npm run icons
      - name: Build desktop Debian package
        run: npm run desktop:build
      - name: Generate Linux artifact provenance
        run: |
          mkdir -p release-evidence/linux
          DEB="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          sha256sum "$DEB" | sed 's#  .*/#  #' > release-evidence/linux/SHA256SUMS
          printf 'source_revision=%s\nworkflow_run=%s\nplatform=linux-amd64-deb\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > release-evidence/linux/SOURCE_REVISION
          npm run release:check > release-evidence/linux/RELEASE_METADATA_VALIDATION.txt
      - name: Upload Linux Debian package
        uses: actions/upload-artifact@v6
        with:
          name: goreecloud-feed-linux-amd64-deb
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            release-evidence/linux/*
          if-no-files-found: error

  android-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Rust toolchain with Android targets
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install 1.97.1 --profile minimal
          "$HOME/.cargo/bin/rustup" target add --toolchain 1.97.1 aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          "$HOME/.cargo/bin/rustc" +1.97.1 --version
      - name: Configure Android NDK
        run: |
          NDK_VERSION="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          test -n "$NDK_VERSION"
          test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Validate release metadata
        run: npm run release:check
      - name: Validate Rust lock consistency
        run: cargo +1.97.1 metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 >/dev/null
      - name: Generate desktop icon prerequisites
        run: npm run icons
      - name: Initialize Android project
        run: npm run android:init -- --ci
      - name: Generate Android application icons
        run: npm run icons
      - name: Build unsigned development APK
        run: npm run android:build
      - name: Generate Android artifact provenance
        run: |
          mkdir -p release-evidence/android
          find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print0 | sort -z | xargs -0 sha256sum | sed 's#  .*/#  #' > release-evidence/android/SHA256SUMS
          test -s release-evidence/android/SHA256SUMS
          printf 'source_revision=%s\nworkflow_run=%s\nplatform=android-debug-apk\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > release-evidence/android/SOURCE_REVISION
          npm run release:check > release-evidence/android/RELEASE_METADATA_VALIDATION.txt
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: goreecloud-feed-android-debug
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            release-evidence/android/*
          if-no-files-found: error
