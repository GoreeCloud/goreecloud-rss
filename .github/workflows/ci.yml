name: Client CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Unit tests
        run: npm test
      - name: Type-check and build web client
        run: npm run build
      - name: Upload generated npm lock evidence
        uses: actions/upload-artifact@v6
        with:
          name: goreecloud-feed-npm-lock
          path: package-lock.json
          if-no-files-found: error
