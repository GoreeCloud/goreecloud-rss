name: Client CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: client-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate release metadata
        run: npm run release:check
      - name: Unit tests
        run: npm test
      - name: Type-check and build web client
        run: npm run build
      - name: Audit dependency posture
        run: npm audit --audit-level=high
