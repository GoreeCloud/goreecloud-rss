name: Client CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Unit tests
        run: npm test
      - name: Type-check and build web client
        run: npm run build
      - name: Audit dependency posture
        run: npm audit --audit-level=high
