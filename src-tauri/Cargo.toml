[package]
name = "goreecloud-feed"
version = "0.1.0"
description = "GoreeCloud Feed desktop and Android shell"
authors = ["GoreeCloud"]
edition = "2021"
license = "MIT"

[lib]
name = "goreecloud_feed_lib"
